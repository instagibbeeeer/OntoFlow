apiVersion: v1
kind: Secret
metadata:
  name: ontoflow-secrets
type: Opaque
stringData:
  ELASTICSEARCH_USERNAME: {{ .Values.secrets.elasticsearchUsername | quote }}
  ELASTICSEARCH_PASSWORD: {{ .Values.secrets.elasticsearchPassword | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
