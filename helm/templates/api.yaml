apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontoflow-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: ontoflow-api
  template:
    metadata:
      labels:
        app: ontoflow-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["uvicorn","main:app","--host","0.0.0.0","--port","8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ontoflow-config
            - secretRef:
                name: ontoflow-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ontoflow-api
spec:
  selector:
    app: ontoflow-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
  type: {{ .Values.api.service.type }}
