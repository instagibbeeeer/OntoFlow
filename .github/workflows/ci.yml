name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and generated-artifact consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            producers/requirements.txt

      - name: Install test/codegen dependencies
        run: python -m pip install --upgrade pip PyYAML==6.0.2

      - name: Regenerate ontology artifacts
        run: python tools/generate.py

      - name: Ensure generated files are committed
        run: git diff --exit-code -- api/generated_manifest.json api/generated_types.py sdk/ontoflow_sdk/generated_models.py es/ontology_objects.json es/documents.json

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax check
        run: python -m compileall -q api sdk producers spark tools

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose
        run: docker compose config --quiet

      - name: Validate development overlay
        run: docker compose -f docker-compose.yml -f compose.dev.yml config --quiet

  docker-build:
    name: Build application images
    runs-on: ubuntu-latest
    needs: [test, compose]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: ontoflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Spark image
        uses: docker/build-push-action@v6
        with:
          context: ./spark
          push: false
          tags: ontoflow-spark:ci
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark

  integration:
    name: Integration tests (API + Elasticsearch + GraphQL + SDK)
    runs-on: ubuntu-latest
    needs: [test, compose]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            producers/requirements.txt

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          python -m pip install requests kafka-python

      - name: Start Elasticsearch and API
        run: docker compose up -d --build elasticsearch elasticsearch-init api

      - name: Run integration suite
        env:
          ONTOFLOW_API_URL: http://localhost:8000
          ONTOFLOW_ES_URL: http://localhost:9200
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}


        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 elasticsearch elasticsearch-init api

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    name: E2E (Kafka → Spark → Delta → Elasticsearch → API/RAG)
    runs-on: ubuntu-latest
    needs: [docker-build, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            producers/requirements.txt

      - name: Install E2E client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 kafka-python==2.0.2

      - name: Start complete OntoFlow stack
        run: docker compose up -d --build

      - name: Run full-pipeline E2E suite
        env:
          ONTOFLOW_API_URL: http://localhost:8000
          ONTOFLOW_ES_URL: http://localhost:9200
          ONTOFLOW_KAFKA: localhost:9092
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v

      - name: Assert Delta Bronze/Silver/Gold tables were created
        run: |
          docker compose exec -T spark-stream sh -ec '
            test -d /lakehouse/bronze/events/_delta_log
            test -d /lakehouse/silver/validated_objects/_delta_log
            test -d /lakehouse/gold/batch/_delta_log
            test -d /lakehouse/gold/quality_finding/_delta_log
            test -d /lakehouse/gold/engineering_document/_delta_log
          '

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=500

      - name: Tear down E2E stack
        if: always()
        run: docker compose down -v --remove-orphan
      - name: Elasticsearch init logs on failure
        if: failure()
        run: |
          echo "=== Elasticsearch init logs ==="
          docker compose logs --no-color --tail=200 api

          echo "=== Elasticsearch logs ==="
          docker compose logs elasticsearch || true

          echo "=== Container status ==="
          docker compose ps -a || true

          echo "=== Elasticsearch health ==="
          docker compose exec -T elasticsearch \
            curl -fsS http://localhost:9200/_cluster/health || true