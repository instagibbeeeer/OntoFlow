name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and generated-artifact consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            producers/requirements.txt

      - name: Install test/codegen dependencies
        run: python -m pip install --upgrade pip PyYAML==6.0.2

      - name: Regenerate ontology artifacts
        run: python tools/generate.py

      - name: Ensure generated files are committed
        run: git diff --exit-code -- api/generated_manifest.json api/generated_types.py sdk/ontoflow_sdk/generated_models.py es/ontology_objects.json es/documents.json

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax check
        run: python -m compileall -q api sdk producers spark tools

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose
        run: docker compose config --quiet

      - name: Validate development overlay
        run: docker compose -f docker-compose.yml -f compose.dev.yml config --quiet

  docker-build:
    name: Build application images
    runs-on: ubuntu-latest
    needs: [test, compose]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: ontoflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Spark image
        uses: docker/build-push-action@v6
        with:
          context: ./spark
          push: false
          tags: ontoflow-spark:ci
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
