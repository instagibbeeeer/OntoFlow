name: ontoflow

x-common: &common
  restart: unless-stopped
  init: true
  networks:
    - ontoflow

services:
  kafka:
    <<: *common
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

kafka-init:
  image: apache/kafka:3.8.0
  restart: "no"
  depends_on:
    kafka:
      condition: service_healthy
  entrypoint: ["/bin/bash", "-ec"]
  command: |
    echo "Waiting for Kafka..."
    until /opt/kafka/bin/kafka-topics.sh \
      --bootstrap-server kafka:29092 \
      --list >/dev/null 2>&1; do
      sleep 2
    done

    echo "Creating topics..."

    /opt/kafka/bin/kafka-topics.sh \
      --bootstrap-server kafka:29092 \
      --create --if-not-exists \
      --topic raw.events \
      --partitions 3 \
      --replication-factor 1

    /opt/kafka/bin/kafka-topics.sh \
      --bootstrap-server kafka:29092 \
      --create --if-not-exists \
      --topic raw.documents \
      --partitions 3 \
      --replication-factor 1

    echo "Kafka topics ready."
  elasticsearch:
    <<: *common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  elasticsearch-init:
    build:
      context: ./api
    restart: "no"
    networks: [ontoflow]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./es:/es:ro
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_MAPPINGS_DIR: /es
    command: ["python", "init_indices.py"]


  spark-stream:
    <<: *common
    build:
      context: ./spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    volumes:
      - ./ontology:/ontology:ro
      - spark-checkpoints:/checkpoints
      - delta-lake:/lakehouse
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LAKEHOUSE_ROOT: /lakehouse
      CHECKPOINT_ROOT: /checkpoints
    command:
      - spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.2.0,org.elasticsearch:elasticsearch-hadoop:8.11.0
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - /app/stream_ingest.py

  api:
    <<: *common
    build:
      context: ./api
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding-worker:
    <<: *common
    build:
      context: ./api
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-hashing}"
      EMBEDDING_POLL_SECONDS: "${EMBEDDING_POLL_SECONDS:-5}"
    command: ["python", "embedding_worker.py"]

networks:
  ontoflow:
    driver: bridge

volumes:
  kafka-data:
  elasticsearch-data:
  spark-checkpoints:
  delta-lake: