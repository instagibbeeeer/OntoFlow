services:
  api:
    volumes:
      - ./api:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  embedding-worker:
    volumes:
      - ./api:/app

  spark-stream:
    volumes:
      - ./spark:/app
      - ./ontology:/ontology:ro
      - spark-checkpoints:/checkpoints
      - delta-lake:/lakehouse
